<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harshali's Shelf</title>
  <meta name="description" content="Harshali Saigal: policy, strategy, product and platform building. Pull a book off the shelf to read about the work.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500;700&family=Courier+Prime&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="intro">
    <div class="nametag">
      <p class="type">Ex Libris</p>
      <h1>Harshali Saigal</h1>
      <p class="type">Policy · Strategy · Product &amp; Platform Building · Ecosystem Development</p>
    </div>
    <p class="hint">pull a book off the shelf <span aria-hidden="true">↴</span></p>
  </header>

  <main class="bookcase">
    <div class="shelf">
      <span class="shelf-label">§ The Work — 2023 to now</span>
      <div class="row" data-shelf="work">
        <div class="stack" aria-hidden="true">
          <span style="--c:#6d4c3d;width:150px"></span>
          <span style="--c:#2f4a3a;width:170px"></span>
          <span style="--c:#c28b2c;width:140px"></span>
        </div>
        <div class="cup" aria-hidden="true">
          <i class="pencil" style="--c:#e0a526;--r:-12deg;--x:10px;--h:120px"></i>
          <i class="pencil" style="--c:#2d6468;--r:4deg;--x:26px;--h:132px"></i>
          <i class="pen" style="--r:14deg;--x:42px;--h:126px"></i>
          <i class="pencil" style="--c:#b0463a;--r:-3deg;--x:34px;--h:110px"></i>
        </div>
      </div>
      <div class="board"></div>
    </div>

    <div class="shelf">
      <span class="shelf-label">§ Notes, Learning &amp; Life</span>
      <div class="row" data-shelf="life">
        <button class="postcard" data-id="contact" aria-label="Open contact postcard">
          <span class="stamp">₹5<br><small>INDIA</small></span>
          <span class="pc-text">Write to me!</span>
          <span class="pc-lines"></span>
        </button>
        <div class="tapes" aria-hidden="true">
          <span class="tape-roll" style="--c:#e7b7a8"></span>
          <span class="tape-roll" style="--c:#a9c3b0"></span>
          <span class="tape-roll small" style="--c:#e8cf85"></span>
        </div>
      </div>
      <div class="board"></div>
    </div>
  </main>

  <footer class="colophon">
    <span>Mumbai, India</span>
    <span>Every book is clickable · Esc to close</span>
    <span>© <span id="year"></span> Harshali Saigal</span>
  </footer>

  <dialog id="reader" aria-labelledby="reader-title">
    <div class="reader-inner"></div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
